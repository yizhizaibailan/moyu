<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣味问答 - 谁是猪？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial Rounded MT Bold', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px 30px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 40px;
            font-size: 2.5rem;
            position: relative;
        }
        
        .animated-text {
            display: inline-block;
            animation: bounce 2s infinite;
            color: #ff4081;
            text-shadow: 2px 2px 0 #ffcc00;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .btn-yes {
            background-color: #4CAF50;
            color: white;
        }
        
        .btn-no {
            background-color: #f44336;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: popIn 0.5s;
        }
        
        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .correct {
            color: #4CAF50;
        }
        
        .wrong {
            color: #f44336;
        }
        
        .close-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        
        .close-btn:hover {
            background-color: #0b7dda;
        }
        
        .pig-emoji {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: wiggle 2s infinite;
        }
        
        @keyframes wiggle {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(10deg);
            }
            75% {
                transform: rotate(-10deg);
            }
        }
        
        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 80%;
            }
        }
        
        .progress {
            margin-top: 20px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span id="question-text" class="animated-text">娄雪是猪吗</span>
        </h1>
        
        <div class="pig-emoji">🐷</div>
        
        <div class="buttons">
            <button class="btn btn-no" id="no-btn">不是</button>
            <button class="btn btn-yes" id="yes-btn">是</button>
        </div>
        
        <div class="progress" id="progress">问题 1/2</div>
    </div>
    
    <!-- 错误弹窗 -->
    <div class="modal" id="wrong-modal">
        <div class="modal-content">
            <h2 class="wrong">回答错误！</h2>
            <p>请重新选择</p>
            <button class="close-btn" id="close-wrong">关闭</button>
        </div>
    </div>
    
    <!-- 正确弹窗 -->
    <div class="modal" id="correct-modal">
        <div class="modal-content">
            <h2 class="correct" id="correct-title">恭喜你答对了！</h2>
            <p id="correct-message">娄雪确实是一只可爱的小猪！</p>
            <button class="close-btn" id="close-correct">关闭</button>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const wrongModal = document.getElementById('wrong-modal');
        const correctModal = document.getElementById('correct-modal');
        const closeWrong = document.getElementById('close-wrong');
        const closeCorrect = document.getElementById('close-correct');
        const questionText = document.getElementById('question-text');
        const correctTitle = document.getElementById('correct-title');
        const correctMessage = document.getElementById('correct-message');
        const progress = document.getElementById('progress');
        
        // 问题状态
        let currentQuestion = 1;
        
        // 添加按钮点击事件
        noBtn.addEventListener('click', function() {
            if (currentQuestion === 1) {
                // 第一个问题，点击"不是"显示错误
                wrongModal.style.display = 'flex';
            } else if (currentQuestion === 2) {
                // 第二个问题，点击"不是"显示正确
                correctTitle.textContent = "回答正确！";
                correctMessage.textContent = "李卓不是猪,娄雪才是🐷，哈哈哈哈！";
                correctModal.style.display = 'flex';
            }
        });
        
        yesBtn.addEventListener('click', function() {
            if (currentQuestion === 1) {
                // 第一个问题，点击"是"显示正确，并进入下一个问题
                correctTitle.textContent = "恭喜你答对了！";
                correctMessage.textContent = "娄雪是李卓的小猪🐷！";
                correctModal.style.display = 'flex';
                
                // 在弹窗关闭后更新问题
                closeCorrect.onclick = function() {
                    correctModal.style.display = 'none';
                    currentQuestion = 2;
                    questionText.textContent = "李卓是猪吗";
                    progress.textContent = "问题 2/2";
                };
            } else if (currentQuestion === 2) {
                // 第二个问题，点击"是"显示错误
                wrongModal.style.display = 'flex';
            }
        });
        
        // 关闭弹窗事件
        closeWrong.addEventListener('click', function() {
            wrongModal.style.display = 'none';
        });
        
        closeCorrect.addEventListener('click', function() {
            correctModal.style.display = 'none';
        });
        
        // 点击弹窗外部关闭
        window.addEventListener('click', function(event) {
            if (event.target === wrongModal) {
                wrongModal.style.display = 'none';
            }
            if (event.target === correctModal) {
                correctModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
